# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.OrgTrustPolicy.json

# Lets the cleanowners workflow in carecinch/admin read CODEOWNERS files, check
# org membership, and open PRs that remove departed members. Only that workflow
# file on main can mint this token.
issuer: https://token.actions.githubusercontent.com
# The org uses immutable subject claims (owner and repo IDs), so renames
# and a re-registered old org name cannot match.
subject: repo:carecinch@333883824/admin@1388362750:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: carecinch/admin/\.github/workflows/cleanowners\.yaml@refs/heads/main

permissions:
  contents: write
  pull_requests: write
  members: read

# Never add .github here. It holds these trust policies, and a token with
# contents: write on it could rewrite its own permissions.
repositories:
  - admin
  - api
  - mobile
  - mobile-legacy
  - website
