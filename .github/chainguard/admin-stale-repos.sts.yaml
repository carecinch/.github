# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.OrgTrustPolicy.json

# Lets the stale-repos workflow in carecinch/admin list org repos and read their
# last push date. Only that workflow file on main can mint this token.
issuer: https://token.actions.githubusercontent.com
# The org uses immutable subject claims (owner and repo IDs), so renames
# and a re-registered old org name cannot match.
subject: repo:carecinch@333883824/admin@1388362750:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: carecinch/admin/\.github/workflows/stale-repos\.yaml@refs/heads/main

permissions:
  metadata: read
