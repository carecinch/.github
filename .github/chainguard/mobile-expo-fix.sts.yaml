# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.OrgTrustPolicy.json

# Lets the expo-fix workflow in carecinch/mobile push a branch and open a PR
# when Expo SDK patch versions drift. Only that workflow file on main can mint
# this token. PRs opened with GITHUB_TOKEN do not trigger CI, so this one does.
issuer: https://token.actions.githubusercontent.com
# The org uses immutable subject claims (owner and repo IDs), so renames
# and a re-registered old org name cannot match.
subject: repo:carecinch@333883824/mobile@1085191042:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: carecinch/mobile/\.github/workflows/expo-fix\.yaml@refs/heads/main

permissions:
  contents: write
  pull_requests: write

# Never add .github here. It holds these trust policies.
repositories:
  - mobile
